name: machinelearning
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pandas=2.3.3
  - matplotlib
  - seaborn
  - numpy=2.3.4
  - scikit-learn=1.7.2
  - opencv=4.12.0
  - scikit-image
  - pip
  - pip:
      - -e .
      - tqdm
      - ipykernel
      - mplfonts
      - mkdocs
      - mkdocs-material
      - mkdocstrings[python]
